version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_PATH=${PATH_PREFIX:-/retrospective-web}
    container_name: ${CONTAINER_NAME:-retrospective-web-prod}
    restart: unless-stopped
    volumes:
      - app_data:/app/data
    environment:
      - ENV=${ENV:-production}
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${CONTAINER_NAME:-retrospective-web-prod}.rule=PathPrefix(`${PATH_PREFIX:-/retrospective-web}`)"
      - "traefik.http.routers.${CONTAINER_NAME:-retrospective-web-prod}.entrypoints=web"
      - "traefik.http.services.${CONTAINER_NAME:-retrospective-web-prod}.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.${CONTAINER_NAME:-retrospective-web-prod}-strip.stripprefix.prefixes=${PATH_PREFIX:-/retrospective-web}"
      - "traefik.http.routers.${CONTAINER_NAME:-retrospective-web-prod}.middlewares=${CONTAINER_NAME:-retrospective-web-prod}-strip"
    networks:
      - web

networks:
  web:
    external: true

volumes:
  app_data:
